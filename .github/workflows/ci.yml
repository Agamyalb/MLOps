%%writefile .github/workflows/ci.yml
name: MLOps CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install scikit-learn joblib pytest numpy
      - run: python train.py
      - run: pytest -v

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying model to cloud..."
